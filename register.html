{% extends "base.html" %}
{% block title %}Create account | SecureGate{% endblock %}
{% block content %}
<section class="form-card">
  <div class="eyebrow">GET STARTED</div><h1>Create your account</h1>
  <p class="muted">Use a unique demo password. Do not reuse a real password.</p>
  <form method="post">
    <label for="username">Username</label>
    <input id="username" name="username" minlength="3" maxlength="30" required autocomplete="username" placeholder="e.g. abhinav_01">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" minlength="10" required autocomplete="new-password" placeholder="At least 10 characters">
    <label for="confirm_password">Confirm password</label>
    <input id="confirm_password" name="confirm_password" type="password" minlength="10" required autocomplete="new-password" placeholder="Enter it again">
    <button class="button primary full" type="submit">Create account</button>
  </form>
  <p class="form-foot">Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
